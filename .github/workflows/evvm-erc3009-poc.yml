name: EVVM ERC-3009 PoC Tests

on:
  push:
    branches:
      - proposal/evvm-erc3009-gasless-deposit
    paths:
      - "experiments/evvm-erc3009-gasless-deposit/**"
      - ".github/workflows/evvm-erc3009-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Foundry tests
        working-directory: experiments/evvm-erc3009-gasless-deposit
        run: forge test -vvv
